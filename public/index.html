<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0e17">
  <title>飞牛 · 文件资源管理器</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
  <!-- 登录层 -->
  <div id="login-layer" class="login-layer">
    <div class="login-card">
      <div class="login-logo">
        <svg viewBox="0 0 48 48" width="52" height="52"><path d="M24 4 L42 14 V34 L24 44 L6 34 V14 Z" fill="none" stroke="#5b8cff" stroke-width="2.4"/><path d="M24 14 L34 20 V32 L24 38 L14 32 V20 Z" fill="#5b8cff" opacity="0.9"/></svg>
      </div>
      <h1>飞牛文件资源管理器</h1>
      <p class="login-sub">FNOS · 私有云盘</p>
      <form id="login-form" autocomplete="off">
        <div class="field">
          <input type="password" id="login-password" placeholder="请输入访问密码" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-primary" id="login-btn">进入</button>
        <p class="login-error" id="login-error"></p>
      </form>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="app" class="app" style="display:none">
    <!-- 侧边栏 -->
    <aside class="sidebar">
      <div class="side-brand">
        <svg viewBox="0 0 48 48" width="30" height="30"><path d="M24 4 L42 14 V34 L24 44 L6 34 V14 Z" fill="none" stroke="#5b8cff" stroke-width="2.4"/><path d="M24 14 L34 20 V32 L24 38 L14 32 V20 Z" fill="#5b8cff" opacity="0.9"/></svg>
        <span class="side-brand-name">飞牛文件管理</span>
      </div>
      <div class="side-label">存储空间</div>
      <div id="side-vols"></div>
      <div class="side-label" style="margin-top:16px">快捷筛选</div>
      <div class="side-nav">
        <div class="side-item" data-filter="all"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>全部文件</div>
        <div class="side-item" data-filter="image"><svg viewBox="0 0 24 24" width="16" height="16"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="8.5" cy="10" r="1.5" fill="currentColor"/><path d="M4 17l4.5-4 3 2.5 3.5-3 5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>图片</div>
        <div class="side-item" data-filter="video"><svg viewBox="0 0 24 24" width="16" height="16"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10 9l5 3-5 3Z" fill="currentColor"/></svg>视频</div>
        <div class="side-item" data-filter="doc"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 3h8l4 4v14H6Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 3v4h4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9 12h6M9 15h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>文档</div>
        <div class="side-item" data-filter="audio"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 18V6l10-2v12M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm10-2a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>音频</div>
      </div>
      <div class="side-foot">飞牛文件资源管理器<br>v2.0 · 私有云盘</div>
    </aside>

    <!-- 主区域 -->
    <div class="main">
      <header class="topbar">
        <div class="nav-btns">
          <button class="icon-btn" id="btn-back" title="后退" disabled><svg viewBox="0 0 24 24" width="17" height="17"><path d="M15 6 L9 12 L15 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button class="icon-btn" id="btn-forward" title="前进" disabled><svg viewBox="0 0 24 24" width="17" height="17"><path d="M9 6 L15 12 L9 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
        <nav class="crumbs" id="breadcrumb"></nav>
        <div class="topbar-right">
          <div class="search-box">
            <svg viewBox="0 0 24 24" width="15" height="15"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20 L16.5 16.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <input type="text" id="search-input" placeholder="搜索当前目录…" autocomplete="off">
          </div>
          <div class="view-toggle">
            <button class="view-btn active" id="view-grid" title="网格视图"><svg viewBox="0 0 24 24" width="16" height="16"><rect x="3" y="3" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="3" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="14" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="14" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
            <button class="view-btn" id="view-list" title="列表视图"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
          </div>
          <button class="icon-btn" id="btn-logout" title="退出登录"><svg viewBox="0 0 24 24" width="17" height="17"><path d="M9 3 H5 A2 2 0 0 0 3 5 V19 A2 2 0 0 0 5 21 H9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M16 17 L21 12 L16 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 12 H9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        </div>
      </header>

      <div class="toolbar">
        <button class="btn btn-primary-bar" id="btn-upload-file">
          <svg viewBox="0 0 24 24" width="15" height="15"><path d="M12 16 V4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M7 9 L12 4 L17 9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 20 H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          上传文件
        </button>
        <button class="btn" id="btn-upload-folder">
          <svg viewBox="0 0 24 24" width="15" height="15"><path d="M3 7 A2 2 0 0 1 5 5 H9 L11 7 H19 A2 2 0 0 1 21 9 V17 A2 2 0 0 1 19 19 H5 A2 2 0 0 1 3 17 Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 11 V16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M10 14 H14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          上传文件夹
        </button>
        <button class="btn" id="btn-new-folder">
          <svg viewBox="0 0 24 24" width="15" height="15"><path d="M3 7 A2 2 0 0 1 5 5 H9 L11 7 H19 A2 2 0 0 1 21 9 V17 A2 2 0 0 1 19 19 H5 A2 2 0 0 1 3 17 Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 10.5 V16.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M9 13.5 H15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          新建文件夹
        </button>
        <div class="spacer"></div>
        <button class="btn" id="btn-refresh">
          <svg viewBox="0 0 24 24" width="15" height="15"><path d="M20 11 A8 8 0 1 0 18.9 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M20 5 V11 H14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          刷新
        </button>
      </div>

      <main class="content">
        <div class="file-list" id="file-list"></div>
      </main>
    </div>

    <!-- 上传进度面板 -->
    <div class="upload-panel" id="upload-panel" style="display:none">
      <div class="upload-head">
        <span id="upload-title">上传中</span>
        <span id="upload-count"></span>
      </div>
      <div class="upload-progress"><div class="upload-bar" id="upload-bar"></div></div>
      <div class="upload-current" id="upload-current"></div>
    </div>
  </div>

  <!-- 右键菜单 -->
  <div class="context-menu" id="context-menu" style="display:none"></div>

  <!-- 预览弹窗 -->
  <div class="preview-mask" id="preview-mask" style="display:none">
    <div class="preview-bar">
      <div class="preview-title" id="preview-title"></div>
      <div class="preview-actions">
        <button class="preview-btn" id="preview-download" title="下载"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 4 V14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M7 11 L12 16 L17 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 20 H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        <button class="preview-btn" id="preview-fullscreen" title="全屏"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 9 V4 H9 M20 9 V4 H15 M4 15 V20 H9 M20 15 V20 H15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="preview-btn" id="preview-close" title="关闭"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 6 L18 18 M18 6 L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      </div>
    </div>
    <div class="preview-body" id="preview-body"></div>
  </div>

  <!-- 通用弹窗 -->
  <div class="modal-mask" id="modal-mask" style="display:none">
    <div class="modal">
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-actions" id="modal-actions"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <input type="file" id="file-input" multiple style="display:none">
  <input type="file" id="folder-input" webkitdirectory multiple style="display:none">

  <script src="/app.js"></script>
</body>
</html>
